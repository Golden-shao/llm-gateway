apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-gateway.fullname" . }}
  labels:
    app: {{ include "llm-gateway.name" . }}
data:
  GATEWAY_UPSTREAM_BASE_URL: {{ .Values.config.upstreamBaseUrl | quote }}
  GATEWAY_RATE_LIMIT_RPM: {{ .Values.config.rateLimitRpm | toString | quote }}
  GATEWAY_MODELS_CACHE_TTL: {{ .Values.config.modelsCacheTtl | toString | quote }}
