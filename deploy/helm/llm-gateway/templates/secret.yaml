{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    app: {{ include "llm-gateway.name" . }}
type: Opaque
stringData:
  GATEWAY_UPSTREAM_API_KEY: {{ .Values.secret.upstreamApiKey | quote }}
  GATEWAY_GATEWAY_API_KEYS: {{ .Values.secret.gatewayApiKeys | quote }}
{{- end }}
