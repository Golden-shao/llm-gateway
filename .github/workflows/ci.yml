name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r gateway/requirements.txt -q
      - name: 运行测试
        run: pytest gateway/tests -q

  docker:
    name: 构建并推送镜像 (GHCR)
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: gateway
          file: gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/llm-gateway:latest
            ghcr.io/${{ github.repository_owner }}/llm-gateway:${{ github.sha }}
